services:
  blog-api:
    build: ./backend
    container_name: blog-api
    restart: unless-stopped
    networks:
      - blog-network
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    depends_on:
      - blog-api
      - mongo
    container_name: frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - blog-network

  mongo:
    image: mongo
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - blog-network

networks:
  blog-network: