[project]
name = "backend"
version = "0.1.0"
description = "Backend for my website"
authors = [
    {name = "Andrii Yashchishen", email = "AndriiYashchishen@protonmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.104.0,<0.105.0)",
    "uvicorn[standard] (>=0.24.0,<0.25.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "beanie (>=2.1.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
